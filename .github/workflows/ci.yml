# ==============================================================================
# CI Workflow - Build and Test on Linux, Windows, and macOS
# ==============================================================================
name: CI

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
            cmake_generator: "Ninja"
            c_compiler: clang
            cxx_compiler: clang++
          - os: windows-latest
            name: Windows
            cmake_generator: "Ninja"
            c_compiler: cl
            cxx_compiler: cl
          - os: macos-latest
            name: macOS
            cmake_generator: "Ninja"
            c_compiler: clang
            cxx_compiler: clang++

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ------------------------------------------------------------------
      # Linux Dependencies
      # ------------------------------------------------------------------
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            sccache \
            build-essential \
            clang \
            libvulkan-dev \
            mesa-vulkan-drivers \
            vulkan-validationlayers \
            libx11-dev \
            libxcb1-dev \
            libxcb-xfixes0-dev \
            libxcb-cursor-dev \
            libxcb-randr0-dev \
            libxcb-keysyms1-dev \
            libxkbcommon-dev \
            libwayland-dev \
            wayland-protocols \
            libdecor-0-dev \
            libpulse-dev \
            libasound2-dev \
            libpipewire-0.3-dev \
            libdrm-dev \
            libgbm-dev \
            libegl-dev \
            libgl-dev \
            libgles-dev \
            libdbus-1-dev \
            libibus-1.0-dev \
            libsystemd-dev \
            libudev-dev

      # ------------------------------------------------------------------
      # macOS Dependencies
      # ------------------------------------------------------------------
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja sccache vulkan-headers

      # ------------------------------------------------------------------
      # Windows Dependencies
      # ------------------------------------------------------------------
      - name: Remove Strawberry Perl (Windows)
        if: runner.os == 'Windows'
        run: choco uninstall strawberryperl -y

      - name: Install sccache (Windows)
        if: runner.os == 'Windows'
        run: choco install sccache -y

      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1.2.8
        with:
          vulkan_version: 1.4.309.0
          install_runtime: true
          cache: true
          optional_components: com.lunarg.vulkan.vma

      # ------------------------------------------------------------------
      # Cache
      # ------------------------------------------------------------------
      - name: Cache CMake dependencies (FetchContent)
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-cmake-deps-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'lib/**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-cmake-deps-

      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/sccache
            ${{ env.LOCALAPPDATA }}\Mozilla\sccache
          key: ${{ runner.os }}-sccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-sccache-

      # ------------------------------------------------------------------
      # Configure Enviroment
      # ------------------------------------------------------------------
      - name: Setup MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Xcode (macOS)
        if: runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      # ------------------------------------------------------------------
      # Configure Build
      # ------------------------------------------------------------------
      - name: Configure CMake
        run: >
          cmake -B build
          -G "${{ matrix.cmake_generator }}"
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx_compiler }}
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -DENGINE_HEADLESS=ON
          -DENABLE_TESTS=ON
          -DENGINE_ENABLE_SANITIZERS=OFF

      # ------------------------------------------------------------------
      # Build
      # ------------------------------------------------------------------
      - name: Build
        run: cmake --build build --config Debug --parallel 2

      # ------------------------------------------------------------------
      # Test
      # ------------------------------------------------------------------
      - name: Run Tests
        working-directory: build
        run: ctest --build-config Debug --output-on-failure --timeout 120
