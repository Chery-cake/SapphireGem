# ==============================================================================
# CI Workflow - Build and Test on Linux, Windows, and macOS
# ==============================================================================
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
            cmake_generator: "Ninja"
            c_compiler: clang
            cxx_compiler: clang++
          - os: windows-latest
            name: Windows
            cmake_generator: "Ninja"
            c_compiler: cl
            cxx_compiler: cl
          - os: macos-latest
            name: macOS
            cmake_generator: "Ninja"
            c_compiler: clang
            cxx_compiler: clang++

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ------------------------------------------------------------------
      # Linux Dependencies
      # ------------------------------------------------------------------
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            sccache \
            build-essential \
            clang \
            libvulkan-dev \
            mesa-vulkan-drivers \
            vulkan-validationlayers \
            libx11-dev \
            libxcb1-dev \
            libxcb-xfixes0-dev \
            libxcb-cursor-dev \
            libxcb-randr0-dev \
            libxcb-keysyms1-dev \
            libxkbcommon-dev \
            libwayland-dev \
            wayland-protocols \
            libdecor-0-dev \
            libpulse-dev \
            libasound2-dev \
            libpipewire-0.3-dev \
            libdrm-dev \
            libgbm-dev \
            libegl-dev \
            libgl-dev \
            libgles-dev \
            libdbus-1-dev \
            libibus-1.0-dev \
            libsystemd-dev \
            libudev-dev

      # ------------------------------------------------------------------
      # macOS Dependencies
      # ------------------------------------------------------------------
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja sccache vulkan-headers

      # ------------------------------------------------------------------
      # Windows Dependencies
      # ------------------------------------------------------------------
      - name: Move Strawberry Perl to end of PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
            $dirs = $env:PATH -split ';'
            $reordered = ($dirs | Where-Object { $_ -notmatch 'Strawberry' }) +
                        ($dirs | Where-Object { $_ -match 'Strawberry' })
            $reordered -join ';' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install sccache (Windows)
        if: runner.os == 'Windows'
        uses: mozilla-actions/sccache-action@v0.0.7

      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1.2.8
        with:
          vulkan_version: 1.4.309.0
          install_runtime: true
          cache: true
          optional_components: com.lunarg.vulkan.vma

      # ------------------------------------------------------------------
      # Cache
      # ------------------------------------------------------------------
      - name: Set sccache dir (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "SCCACHE_DIR=$env:LOCALAPPDATA\Mozilla\sccache" >> $env:GITHUB_ENV

      - name: Set sccache dir (Linux/macOS)
        if: runner.os != 'Windows'
        run: echo "SCCACHE_DIR=$HOME/.cache/sccache" >> $GITHUB_ENV

      - name: Cache CMake dependencies (FetchContent)
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-cmake-deps-${{ github.ref_name }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'lib/**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-cmake-deps-${{ github.ref_name }}
            ${{ runner.os }}-cmake-deps-

      - name: Cache CMake dependencies (ExternalProject)
        uses: actions/cache@v4
        with:
          path: build/lib
          key: ${{ runner.os }}-cmake-lib-${{ github.ref_name }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'lib/**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-cmake-lib-${{ github.ref_name }}
            ${{ runner.os }}-cmake-lib-

      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: ${{ runner.os }}-sccache-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-sccache-${{ github.ref_name }}-
            ${{ runner.os }}-sccache-

      - name: Start sccache server
        shell: bash
        run: sccache --start-server || true

      # ------------------------------------------------------------------
      # Configure Environment
      # ------------------------------------------------------------------
      - name: Setup MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Xcode (macOS)
        if: runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true

      # ------------------------------------------------------------------
      # Configure Build
      # ------------------------------------------------------------------
      - name: Configure CMake
        run: >
          cmake -B build
          -G "${{ matrix.cmake_generator }}"
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx_compiler }}
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -DENGINE_HEADLESS=ON
          -DENABLE_TESTS=ON
          -DENGINE_ENABLE_SANITIZERS=OFF

      # ------------------------------------------------------------------
      # Build
      # ------------------------------------------------------------------
      - name: Build
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 4
        run: cmake --build build --config Release 2>&1 | tee build/build.log
        shell: bash

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

      # ------------------------------------------------------------------
      # Test
      # ------------------------------------------------------------------
      - name: Run Tests
        working-directory: build
        run: ctest --build-config Release --output-on-failure --timeout 120 --parallel 4

      # ------------------------------------------------------------------
      # Upload Artifacts on Failure
      # ------------------------------------------------------------------
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.name }}
          path: build/build.log
          retention-days: 7

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.name }}
          path: build/Testing/
          retention-days: 7
